version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: memu-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: memu
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - memu-network

  memu:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: memu-app
    command: /bin/sh -c ". .venv/bin/activate && alembic upgrade head && uvicorn src.memu.main:app --host 0.0.0.0 --port 8000 --reload"
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/memu}
      AIRTOP_API_KEY: ${AIRTOP_API_KEY}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - .:/app                  # full codebase mounted for --reload
      - /app/.venv              # preserve container's .venv
    networks:
      - memu-network
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: memu-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - memu-network
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  memu-network:
    driver: bridge